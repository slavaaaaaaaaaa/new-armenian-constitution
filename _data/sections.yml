- id: parties
  en:
    h: Parties and media
    s: Funding, bans, and internal democracy.
  ru:
    h: Партии и СМИ
    s: Финансирование, запрет и внутренняя демократия.
  hy:
    h: Կուսակցություններ և լրատվամիջոցներ
    s: Ֆինանսավորում, արգելում և ներքին ժողովրդավարություն։
  items:
  - tag: new
    en:
      h: Parties funded only by citizens and the state
      p: Parties may receive money only as donations from citizens and, where the law provides, from the state budget. The current constitution sets no limit on funding sources; it only requires parties to publish annual reports on their finances.
    ru:
      h: Партии финансируются только гражданами и государством
      p: Партии могут получать деньги только как пожертвования граждан и, в предусмотренных законом случаях, из госбюджета. Действующая конституция не ограничивает источники финансирования; она только обязывает партии ежегодно публиковать финансовые отчёты.
    hy:
      h: Կուսակցությունները ֆինանսավորվում են միայն քաղաքացիների և պետության կողմից
      p: Կուսակցությունները կարող են գումար ստանալ միայն քաղաքացիների նվիրատվություններից և, օրենքով նախատեսված դեպքերում, պետական բյուջեից։ Գործող Սահմանադրությունը ֆինանսավորման աղբյուրները չի սահմանափակում, այն միայն պահանջում է, որ կուսակցությունները հրապարակեն իրենց ֆինանսական գործունեության տարեկան հաշվետվությունները։
    refs:
    - a: 27
      p: 5
    - cur: 46
      p: 3
  - tag: new
    hot: true
    en:
      h: Foreign funding is grounds to ban a party
      p: 'A party is subject to a ban by the Constitutional Court if it received funding from a foreign source. The same part lists the other grounds: advocating violent overthrow of the constitutional order, renouncing the state''s independence, or national or religious hatred; using violence to overthrow the constitutional order; or activity aimed at undermining voters'' free will. Today the only grounds for a ban are advocating or using violence to overthrow the constitutional order.'
    ru:
      h: Иностранное финансирование как основание для запрета партии
      p: 'Партия подлежит запрету решением Конституционного суда, если получила финансирование из иностранного источника. В той же части перечислены другие основания: пропаганда насильственного свержения конституционного строя, отказа от независимости государства, национальной или религиозной ненависти; применение насилия для свержения строя; деятельность, направленная на искажение свободного волеизъявления избирателей. Сейчас запретить партию можно только за пропаганду или применение насилия для свержения конституционного строя.'
    hy:
      h: Օտարերկրյա ֆինանսավորումը կուսակցության արգելման հիմք է
      p: Կուսակցությունը ենթակա է արգելման Սահմանադրական դատարանի կողմից, եթե ֆինանսավորում է ստացել օտարերկրյա աղբյուրից։ Նույն մասում թվարկված են մյուս հիմքերը՝ սահմանադրական կարգի բռնի տապալման, պետության անկախությունից հրաժարվելու կամ ազգային կամ կրոնական ատելության քարոզը, սահմանադրական կարգը տապալելու համար բռնության կիրառումը, կամ ընտրողների ազատ կամքի խաթարմանն ուղղված գործունեությունը։ Այսօր արգելման միակ հիմքը սահմանադրական կարգի բռնի տապալման քարոզը կամ դրա համար բռնության կիրառումն է։
    refs:
    - a: 24
      p: 12
    - cur: 46
      p: 4
  - tag: new
    en:
      h: Party bodies must be elected
      p: Parties must use elections to form their party bodies; today the constitution only says party structure and activity may not contradict democratic principles. Parties and media must operate with financial transparency. Today parties must publish annual financial reports, and media have no such constitutional duty.
    ru:
      h: Органы партий должны избираться
      p: Партии обязаны формировать свои органы через выборы; сейчас конституция лишь требует, чтобы устройство и деятельность партий не противоречили демократическим принципам. Партии и СМИ должны работать финансово прозрачно. Сейчас партии обязаны публиковать годовые финансовые отчёты, а у СМИ такой конституционной обязанности нет.
    hy:
      h: Կուսակցության մարմինները պետք է ընտրովի լինեն
      p: Կուսակցությունները պետք է իրենց մարմինները ձևավորեն ընտրությունների միջոցով։ Այսօր Սահմանադրությունը միայն ասում է, որ կուսակցության կառուցվածքը և գործունեությունը չեն կարող հակասել ժողովրդավարական սկզբունքներին։ Կուսակցությունները և լրատվամիջոցները պետք է գործեն ֆինանսական թափանցիկությամբ։ Այսօր կուսակցությունները պետք է հրապարակեն տարեկան ֆինանսական հաշվետվություններ, իսկ լրատվամիջոցների համար նման սահմանադրական պարտականություն չկա։
    refs:
    - a: 27
      p: 3
    - a: 27
      p: 4
