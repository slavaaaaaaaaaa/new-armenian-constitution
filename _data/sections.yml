  - tag: chg
    en:
      h: Community councils elected proportionally; councils pick community heads
      p: Community councils and heads serve five years, as today. Councils are elected by a proportional system and the community head is elected indirectly; the Electoral Code may allow majoritarian elections only in exceptional cases. Today the Electoral Code may provide for either direct or indirect election of the community head.
    ru:
      h: Советы избираются по спискам и выбирают глав общин
      p: Советы и главы общин избираются на пять лет, как и сейчас. Советы избираются по пропорциональной системе, глава общины избирается косвенно; мажоритарные выборы Избирательный кодекс может допустить лишь в исключительных случаях. Сейчас Избирательный кодекс может предусмотреть как прямые, так и косвенные выборы главы общины.
    hy:
      h: Ավագանին ընտրվում է համամասնական կարգով և ընտրում է համայնքի ղեկավարին
      p: Համայնքի ավագանին և ղեկավարը, ինչպես այսօր, պաշտոնավարում են հինգ տարի։ Ավագանին ընտրվում է համամասնական ընտրակարգով, իսկ համայնքի ղեկավարը՝ անուղղակի ընտրությամբ։ Ընտրական օրենսգիրքը կարող է մեծամասնական ընտրություններ նախատեսել միայն բացառիկ դեպքերում։ Այսօր Ընտրական օրենսգիրքը կարող է նախատեսել համայնքի ղեկավարի ինչպես ուղղակի, այնպես էլ անուղղակի ընտրություն։
    refs:
    - a: 72
      p: 1
    - cur: 181
      p: 1
