- id: citizens
  en:
    h: Citizens and rights
    s: Citizenship, voting, and how rights are listed and limited.
  ru:
    h: Граждане и права
    s: Гражданство, право голоса, перечень прав и их ограничения.
  hy:
    h: Քաղաքացիներ և իրավունքներ
    s: Քաղաքացիություն, ընտրական իրավունք, իրավունքների ցանկը և դրանց սահմանափակումները։
  items:
  - tag: new
    hot: true
    en:
      h: Courts may strip citizenship
      p: In cases set by law, a court may deprive a person of citizenship for crimes against the foundations of the constitutional order or state security. The current constitution forbids deprivation of citizenship outright. The clause itself does not mention statelessness or limit this to dual citizens; which crimes qualify is left to ordinary law.
    ru:
      h: Суд сможет лишать гражданства
      p: В предусмотренных законом случаях суд может лишить гражданства за преступления против основ конституционного строя или безопасности государства. Действующая конституция прямо запрещает лишение гражданства. Сама норма не упоминает безгражданство и не ограничивается лицами с двойным гражданством; какие именно преступления подпадают под неё, решит обычный закон.
    hy:
      h: Դատարանը կարող է զրկել քաղաքացիությունից
      p: Օրենքով սահմանված դեպքերում դատարանը կարող է անձին զրկել քաղաքացիությունից սահմանադրական կարգի հիմունքների կամ պետության անվտանգության դեմ ուղղված հանցագործությունների համար։ Գործող Սահմանադրությունն ուղղակիորեն արգելում է քաղաքացիությունից զրկելը։ Դրույթն ինքը չի նշում քաղաքացիություն չունեցող դառնալու վտանգի մասին և չի սահմանափակվում երկքաղաքացիներով։ Թե կոնկրետ որ հանցագործություններն են դրա տակ ընկնում, կորոշի սովորական օրենքը։
    quote:
      hy: քաղաքացիությունից զրկելը՝ սահմանադրական կարգի հիմունքների կամ պետության անվտանգության դեմ ուղղված հանցագործությունների համար
      en: '"deprivation of citizenship for crimes directed against the foundations of the constitutional order or the security of the state"'
      ru: «лишение гражданства за преступления, направленные против основ конституционного строя или безопасности государства»
    refs:
    - a: 24
      p: 11
      pt: 5
    - cur: 47
      p: 5
    - ctx: true
      label:
        en: Asbarez
        ru: Asbarez
      url: https://asbarez.com/new-draft-constitution-publicized/
  - tag: chg
    en:
      h: Simplified citizenship for ethnic Armenians stays, the right on settling goes
      p: Ethnic Armenians still acquire citizenship through a simplified procedure set by law, as in the current constitution. The current constitution also gives ethnic Armenians a right to citizenship from the moment they settle in Armenia; the draft does not carry that over.
    ru:
      h: Упрощённое гражданство для этнических армян сохранено, право при переезде убрано
      p: Этнические армяне по-прежнему получают гражданство в упрощённом порядке, установленном законом, как и по действующей конституции. Действующая конституция также даёт этническим армянам право на гражданство с момента переезда в Армению; в проект это право не перенесено.
    hy:
      h: Էթնիկ հայերի պարզեցված քաղաքացիությունը մնում է, բնակություն հաստատելիս իրավունքը՝ ոչ
      p: Էթնիկ հայերը, ինչպես գործող Սահմանադրությամբ, շարունակում են քաղաքացիություն ձեռք բերել օրենքով սահմանված պարզեցված կարգով։ Գործող Սահմանադրությունը նաև էթնիկ հայերին իրավունք է տալիս քաղաքացիություն ստանալու Հայաստանում բնակություն հաստատելու պահից։ Նախագիծն այդ իրավունքը չի պահպանում։
    refs:
    - a: 20
      p: 1
      pt: 14
    - cur: 47
      p: 3
    - cur: 47
      p: 4
  - tag: kept
    en:
      h: Right to change citizenship and to enter Armenia protected
      p: The draft still bans depriving a citizen of the right to change citizenship, and still bans restricting a citizen's right to enter Armenia. The current constitution has both rules.
    ru:
      h: Право сменить гражданство и въехать в Армению защищено
      p: Проект по-прежнему запрещает лишать гражданина права сменить гражданство и ограничивать его право на въезд в Армению. Оба правила есть и в действующей конституции.
    hy:
      h: Քաղաքացիությունը փոխելու և Հայաստան մուտք գործելու իրավունքը պաշտպանված է
      p: Նախագիծը շարունակում է արգելել քաղաքացուն զրկել քաղաքացիությունը փոխելու իրավունքից և սահմանափակել Հայաստան մուտք գործելու նրա իրավունքը։ Գործող Սահմանադրությունում երկու կանոններն էլ կան։
    refs:
    - a: 23
      p: 1
      pt: 17
    - a: 23
      p: 1
      pt: 9
    - cur: 47
      p: 5
    - cur: 40
      p: 4
  - tag: new
    hot: true
    en:
      h: Residency requirement to vote
      p: In national elections and referendums, only citizens aged 18+ who lived in Armenia permanently for at least one of the two years before the vote may vote. In local elections, foreign citizens and stateless persons aged 18+ may also vote if they lived in the community for at least one of the two years before. Today every citizen aged 18+ may vote in national elections, and the law may let non-citizens vote locally. AP reports this limits the influence of the diaspora, including Armenians in Russia.
    ru:
      h: Ценз оседлости для голосования
      p: На общенациональных выборах и референдумах голосовать могут только граждане, достигшие 18 лет и постоянно прожившие в Армении не меньше года из двух лет перед голосованием. На местных выборах голосовать могут и иностранцы и лица без гражданства, достигшие 18 лет, если они прожили в общине не меньше года из двух предыдущих. Сейчас на общенациональных выборах может голосовать любой гражданин, достигший 18 лет, а право неграждан голосовать на местных выборах может установить закон. По оценке AP, это ограничивает влияние диаспоры, в том числе армян в России.
    hy:
      h: Ընտրելու համար բնակության պահանջ
      p: Համապետական ընտրություններում և հանրաքվեներում ընտրել կարող են միայն 18 տարին լրացած այն քաղաքացիները, որոնք քվեարկությանը նախորդող երկու տարվա ընթացքում առնվազն մեկ տարի մշտապես բնակվել են Հայաստանում։ Տեղական ընտրություններում ընտրել կարող են նաև 18 տարին լրացած օտարերկրյա քաղաքացիները և քաղաքացիություն չունեցող անձինք, եթե նախորդող երկու տարվա ընթացքում առնվազն մեկ տարի բնակվել են տվյալ համայնքում։ Այսօր համապետական ընտրություններում ընտրելու իրավունք ունի 18 տարին լրացած յուրաքանչյուր քաղաքացի, իսկ ոչ քաղաքացիների մասնակցությունը տեղական ընտրություններին կարող է սահմանվել օրենքով։ AP-ն հաղորդում է, որ սա սահմանափակում է սփյուռքի, այդ թվում Ռուսաստանում ապրող հայերի ազդեցությունը։
    refs:
    - a: 20
      p: 1
      pt: 28
    - cur: 48
