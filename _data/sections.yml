- id: foundations
  en:
    h: Identity and foundations
    s: Preamble, the nature of the state, symbols, and how the constitution itself can change.
  ru:
    h: Основы государства
    s: Преамбула, характер государства, символы и порядок изменения самой конституции.
  hy:
    h: Ինքնություն և հիմքեր
    s: Նախաբանը, պետության բնույթը, խորհրդանիշները և Սահմանադրության փոփոխման կարգը։
  items:
  - tag: rem
    hot: true
    en:
      h: Declaration of Independence removed from the preamble
      p: The new preamble no longer refers to the 1990 Declaration of Independence. It speaks of building a state "within our internationally recognized territory." Removing this reference was one of Azerbaijan's conditions for a peace deal.
    ru:
      h: Декларация о независимости убрана из преамбулы
      p: Новая преамбула больше не ссылается на Декларацию о независимости 1990 года. В ней говорится о строительстве государства «на нашей международно признанной территории». Удаление этой ссылки было одним из условий Азербайджана для заключения мира.
    hy:
      h: Անկախության մասին հռչակագիրը հանվել է նախաբանից
      p: Նոր նախաբանն այլևս չի հղում 1990 թվականի Անկախության մասին հռչակագրին։ Այնտեղ խոսվում է մեր միջազգայնորեն ճանաչված տարածքում պետություն կառուցելու մասին։ Այս հղման հանումը խաղաղության համաձայնագրի համար Ադրբեջանի պայմաններից մեկն էր։
    refs:
    - pre: true
    - curpre: true
    - ctx: true
      label:
        en: Meduza (RU)
        hy: Meduza (ռուս.)
        ru: Медуза
      url: https://meduza.io/news/2026/11/23/pashinyan-opublikoval-proekt-novoy-konstitutsii-armenii-po-trebovaniyu-azerbaydzhana-iz-nee-isklyuchili-otsylku-k-vossoedineniyu-s-nagornym-karabahom
  - tag: new
    en:
      h: Armenia defined as a secular state
      p: '"Secular" is added to the list: sovereign, democratic, rule-of-law, secular, social state.'
    ru:
      h: Армения названа светским государством
      p: 'В определение государства добавлено слово «светское»: суверенное, демократическое, правовое, светское, социальное.'
    hy:
      h: Հայաստանը սահմանվում է որպես աշխարհիկ պետություն
      p: Պետության բնութագրմանն ավելանում է «աշխարհիկ» բառը՝ ինքնիշխան, ժողովրդավարական, իրավական, աշխարհիկ, սոցիալական պետություն։
    refs:
    - a: 2
      p: 1
    - cur: 1
    - ctx: true
      label:
        en: Asbarez
        ru: Asbarez
      url: https://asbarez.com/new-draft-constitution-publicized/
  - tag: chg
    en:
      h: State and Church relations must be set by law
      p: The Armenian Apostolic Church keeps its recognized role as the national church. Its relations with the state "are regulated by law," which makes such a law mandatory rather than optional.
    ru:
      h: Отношения государства и Церкви обязательно регулируются законом
      p: Армянская апостольская церковь сохраняет признанную роль национальной церкви. Её отношения с государством «регулируются законом», то есть такой закон становится обязательным, а не возможным.
    hy:
      h: Պետության և Եկեղեցու հարաբերությունները պետք է կարգավորվեն օրենքով
      p: Հայաստանյայց Առաքելական Սուրբ Եկեղեցին պահպանում է ազգային եկեղեցու ճանաչված դերը։ Նախագծի համաձայն՝ պետության հետ նրա հարաբերությունները կարգավորվում են օրենքով, այսինքն՝ նման օրենքը դառնում է պարտադիր, ոչ թե հնարավոր։
    refs:
    - a: 15
      p: 2
    - cur: 18
    - ctx: true
      label:
        en: Asbarez
        ru: Asbarez
      url: https://asbarez.com/new-draft-constitution-publicized/
  - tag: chg
    en:
      h: Flag and coat of arms move out of the constitution into a law
      p: The current constitution describes the flag and coat of arms in its own text (Mount Ararat with Noah's Ark on the shield) and leaves their detailed description and the anthem to ordinary law. The draft only names the symbols and requires the descriptions and the anthem to be set by a law adopted by referendum. Today only the text of Art. 21 needs a referendum to change; under the draft, changing the anthem or the symbols' descriptions would also need one.
    ru:
      h: Флаг и герб переносятся из конституции в закон
      p: Действующая конституция описывает флаг и герб прямо в своём тексте (гора Арарат с Ноевым ковчегом на щите), а подробное описание и гимн оставляет обычному закону. Проект только называет символы и требует, чтобы их описание и гимн устанавливались законом, принимаемым на референдуме. Сейчас референдум нужен только для изменения текста ст. 21; по проекту он понадобится и для изменения гимна или описания символов.
    hy:
      h: Դրոշն ու զինանշանը Սահմանադրությունից տեղափոխվում են օրենք
      p: Գործող Սահմանադրությունը դրոշն ու զինանշանը նկարագրում է հենց իր տեքստում (վահանի վրա Արարատ լեռը՝ Նոյյան տապանով), իսկ մանրամասն նկարագրությունը և օրհներգը թողնում է սովորական օրենքին։ Նախագիծը միայն անվանում է խորհրդանիշները և պահանջում, որ դրանց նկարագրությունը և օրհներգը սահմանվեն հանրաքվեով ընդունվող օրենքով։ Այսօր հանրաքվե է պետք միայն 21-րդ հոդվածի տեքստը փոխելու համար, իսկ նախագծով այն անհրաժեշտ կլինի նաև օրհներգը կամ խորհրդանիշների նկարագրությունը փոխելու համար։
    refs:
    - a: 16
      p: 1
    - a: 84
      p: 2
    - cur: 21
      ps: 3–4
    - cur: 202
  - tag: chg
    en:
      h: Constitution changes only through a referendum, with a higher bar for voters
      p: Today parliament can amend most articles by a two-thirds vote; only chapters 1–3, 7, 10 and 15 and a list of named articles require a referendum. The draft provides no parliamentary route. A constitution or amendment passes if more than half of participants vote yes and that is at least one third of all eligible voters; today it is one quarter. The vote parliament needs to send a new constitution or an amendment to a protected article to a referendum falls from two thirds of all MPs to three fifths. Today three fifths already suffices for other amendments that parliament itself failed to pass.
    ru:
      h: Конституция меняется только референдумом, и порог для избирателей выше
      p: Сейчас парламент может менять большинство статей двумя третями голосов; референдум обязателен только для глав 1–3, 7, 10 и 15 и ряда отдельных статей. В проекте парламентского пути нет. Конституция или поправка принимается, если «за» больше половины участников и не меньше трети всех имеющих право голоса; сейчас это четверть. Чтобы вынести на референдум новую конституцию или поправку к защищённым статьям, парламенту понадобятся не две трети депутатов, а три пятых. Для остальных поправок, которые парламент сам не принял, три пятых достаточно и сейчас.
    hy:
      h: Սահմանադրությունը փոխվում է միայն հանրաքվեով, և ընտրողների շեմը բարձրանում է
      p: Այսօր խորհրդարանը կարող է հոդվածների մեծ մասը փոփոխել պատգամավորների ընդհանուր թվի երկու երրորդի ձայներով, իսկ հանրաքվե պարտադիր է միայն 1–3, 7, 10 և 15-րդ գլուխների և առանձին թվարկված հոդվածների համար։ Նախագիծը խորհրդարանական ճանապարհ չի նախատեսում։ Սահմանադրությունը կամ փոփոխությունն ընդունվում է, եթե «կողմ» է քվեարկել մասնակիցների կեսից ավելին, և դա կազմում է ընտրելու իրավունք ունեցողների առնվազն մեկ երրորդը։ Այսօր այդ շեմը մեկ քառորդն է։ Նոր Սահմանադրությունը կամ պաշտպանված հոդվածների փոփոխությունը հանրաքվեի դնելու համար խորհրդարանին անհրաժեշտ ձայները պատգամավորների ընդհանուր թվի երկու երրորդից իջնում են երեք հինգերորդի։ Մյուս փոփոխությունների համար, որոնք խորհրդարանն ինքը չի ընդունել, երեք հինգերորդն արդեն այսօր բավարար է։
    refs:
