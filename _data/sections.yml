  - tag: new
    en:
      h: Courts may remove the right to vote and run
      p: In cases set by law, courts may restrict voting and candidacy rights of people convicted of crimes against the constitutional order or state security, or of election crimes. Today the right to vote is lost only by people a court has declared legally incapable or who are serving a sentence for an intentional grave crime; the right to run is also lost while serving a sentence for any crime. There is no separate court-ordered ban.
    ru:
      h: Суд сможет лишать права голосовать и избираться
      p: В случаях, установленных законом, суд может ограничить право голосовать и избираться для осуждённых за преступления против конституционного строя, безопасности государства или за избирательные преступления. Сейчас права голоса лишаются только признанные судом недееспособными и отбывающие наказание за умышленные тяжкие преступления; права избираться лишаются также отбывающие наказание за любое преступление. Отдельного запрета по решению суда нет.
    hy:
      h: Դատարանը կարող է զրկել ընտրելու և ընտրվելու իրավունքից
      p: Օրենքով սահմանված դեպքերում դատարանը կարող է սահմանափակել ընտրելու և ընտրվելու իրավունքը այն անձանց համար, ովքեր դատապարտվել են սահմանադրական կարգի կամ պետության անվտանգության դեմ ուղղված հանցագործությունների կամ ընտրական հանցագործությունների համար։ Այսօր ընտրելու իրավունքից զրկված են միայն դատարանի կողմից անգործունակ ճանաչված և դիտավորությամբ կատարված ծանր հանցանքի համար պատիժ կրող անձինք, իսկ ընտրվելու իրավունքից՝ նաև ցանկացած հանցանքի համար պատիժ կրողները։ Դատարանի որոշմամբ առանձին արգելք նախատեսված չէ։
    refs:
    - a: 24
      p: 13
    - cur: 48
      p: 4
  - tag: chg
    en:
      h: Rights in one list, with absolute rights named
      p: Core rights are gathered in one article instead of one article per right. A separate part names "absolute rights" that can never be restricted, a term the current constitution does not use. Another part lists the rights that cannot be suspended under martial law or a state of emergency, which today is done in Art. 76.
    ru:
      h: Права собраны в один список, абсолютные права названы
      p: Основные права собраны в одной статье, а не по статье на каждое право. Отдельная часть называет «абсолютные права», которые нельзя ограничить никогда; в действующей конституции такого понятия нет. Другая часть перечисляет права, которые нельзя приостановить при военном или чрезвычайном положении; сейчас это делает ст. 76.
    hy:
      h: Իրավունքները՝ մեկ ցանկում, բացարձակ իրավունքները՝ առանձնացված
      p: Հիմնական իրավունքները հավաքված են մեկ հոդվածում՝ յուրաքանչյուր իրավունքի համար առանձին հոդվածի փոխարեն։ Առանձին մասում թվարկված են բացարձակ իրավունքները, որոնք երբեք չեն կարող սահմանափակվել։ Գործող Սահմանադրությունն այդ եզրույթը չի օգտագործում։ Մեկ այլ մասում թվարկված են այն իրավունքները, որոնք չեն կարող կասեցվել ռազմական կամ արտակարգ դրության ժամանակ։ Այսօր դա արվում է 76-րդ հոդվածում։
