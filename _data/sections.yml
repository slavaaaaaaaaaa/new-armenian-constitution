  - tag: new
    en:
      h: Jury trials
      p: In cases and in the manner set by law, cases are heard with jurors. The current constitution does not mention juries.
    ru:
      h: Суд присяжных
      p: В случаях и порядке, установленных законом, дела рассматриваются с участием присяжных. Действующая конституция присяжных не упоминает.
    hy:
      h: Երդվյալ ատենակալներ
      p: Օրենքով սահմանված դեպքերում և կարգով գործերը քննվում են երդվյալ ատենակալների մասնակցությամբ։ Գործող Սահմանադրությունը երդվյալ ատենակալների մասին չի նշում։
    refs:
    - a: 59
      p: 3
    - cur: 162
    - explainer: true
  - tag: chg
    en:
      h: Independent prosecution with a Prosecutorial Council
      p: The prosecution service becomes a "single independent system" led by the Prosecutor General; today the constitution calls it a single system, without "independent." The Prosecutor General is still elected by at least three fifths of MPs, but if that fails a second round needs only a majority. The term becomes seven years with no re-election, instead of six years with at most two in a row. The minimum age of 35 for the Prosecutor General is dropped. A new Prosecutorial Council, an independent body guarding prosecutors' independence, is formed within six months of the next parliament's first session.
    ru:
      h: Независимая прокуратура и Прокурорский совет
      p: Прокуратура становится «единой независимой системой» во главе с генпрокурором; сейчас конституция называет её единой системой, без слова «независимая». Генпрокурора по-прежнему избирают не менее трёх пятых депутатов, но если это не удалось, во втором туре достаточно большинства. Срок становится семилетним без права переизбрания вместо шести лет и не более двух сроков подряд. Минимальный возраст 35 лет для генпрокурора отменяется. Новый Прокурорский совет, независимый орган, гарантирующий независимость прокуроров, формируется в течение шести месяцев после первой сессии следующего парламента.
    hy:
      h: Անկախ դատախազություն և Դատախազական խորհուրդ
      p: Դատախազությունը դառնում է գլխավոր դատախազի գլխավորած միասնական անկախ համակարգ։ Այսօր Սահմանադրությունն այն անվանում է միասնական համակարգ՝ առանց «անկախ» բառի։ Գլխավոր դատախազը դեռ ընտրվում է պատգամավորների առնվազն երեք հինգերորդի ձայներով, բայց եթե դա չի հաջողվում, երկրորդ փուլում բավական է մեծամասնությունը։ Ժամկետը դառնում է յոթ տարի՝ առանց վերընտրվելու, վեց տարվա և անընդմեջ առավելագույնը երկու ժամկետի փոխարեն։ Գլխավոր դատախազի համար 35 տարեկան նվազագույն տարիքի պահանջը հանվում է։ Նոր Դատախազական խորհուրդը՝ դատախազների անկախությունը երաշխավորող անկախ մարմին, ձևավորվում է հաջորդ գումարման խորհրդարանի առաջին նստաշրջանից հետո վեց ամսվա ընթացքում։
