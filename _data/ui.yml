  about: Այս կայքը պարզ լեզվով ամփոփում է, թե ինչ կփոխի Հայաստանի նոր Սահմանադրության նախագիծը գործող Սահմանադրության համեմատ։ Այն նախատեսված է բոլոր նրանց համար, ովքեր ուզում են հասկանալ նախագիծը՝ առանց այն ամբողջությամբ կարդալու, և յուրաքանչյուր կետ հղում է պաշտոնական տեքստին, որպեսզի կարողանաք ինքներդ ստուգել։
  lastUpdated: Վերջին թարմացումը
  dateFormat: '%d.%m.%Y'
  title: Ինչ է փոխում Հայաստանի Սահմանադրության նախագիծը
  lede: Յուրաքանչյուր կետ հղում է նախագծի այն հոդվածին, որը նկարագրում է։ Եթե կետը համեմատում է նախագիծը գործող կանոնների հետ, այն հղում է նաև գործող հոդվածին կամ լրատվական հրապարակմանը։ Կառավարության կայքը մեկ էջում ցույց է տալիս մոտ տասը հոդված, ուստի փնտրեք հղման մեջ նշված հոդվածի և մասի համարը։
  meta: Տեքստը կարդացվել է <a href="https://yourconstitution.am/hy/constitution/proposed/article/1" target="_blank" rel="noopener">yourconstitution.am</a> կայքից 24.11.2026-ին։ Յուրաքանչյուր կետ համեմատվել է գործող Սահմանադրության հետ և հղում է համապատասխան գործող հոդվածին։
